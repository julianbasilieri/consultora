<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synergy Consulting</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href='https://fonts.googleapis.com/css?family=Alata' rel='stylesheet'>
    <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"
        integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" id="icon-page" href="./images/logo.png" type="image/x-icon">
    <style>
        body {
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            font-family: 'Alata', sans-serif;
        }
        .header nav {
            background: #279bc8;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .header h4 {
            font-weight: bold;
            letter-spacing: 2px;
        }
        section {
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(39,155,200,0.08);
            margin: 32px auto;
            padding: 32px 24px;
            background: #fff;
            max-width: 1100px;
        }
        #titulo {
            color: #279bc8;
            font-weight: bold;
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(39,155,200,0.10);
            margin: 16px;
        }
        .card-title {
            color: #279bc8;
            font-weight: bold;
        }
        .fixed-action-btn a {
            box-shadow: 0 2px 8px rgba(39,155,200,0.20);
        }
        @media (max-width: 600px) {
            section {
                padding: 16px 4px;
            }
            .header h4 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
